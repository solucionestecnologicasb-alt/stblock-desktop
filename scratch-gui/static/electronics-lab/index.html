    <script>
      // Silenciar logs ruidosos del simulador (motor [SimEngine] y avisos de
      // límite físico del protoboard) para no ensuciar la consola de STBlock.
      (function () {
        var NOISE = ['[SimEngine]', 'Límite físico'];
        function isNoise(args) {
          var first = args.length ? args[0] : null;
          if (typeof first !== 'string') return false;
          for (var i = 0; i < NOISE.length; i++) {
            if (first.indexOf(NOISE[i]) !== -1) return true;
          }
          return false;
        }
        ['log', 'warn', 'info'].forEach(function (level) {
          var original = console[level];
          if (typeof original !== 'function') return;
          console[level] = function () {
            if (isNoise(arguments)) return;
            return original.apply(console, arguments);
          };
        });
      }());
    </script>
