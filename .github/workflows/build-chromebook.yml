name: Build STBlock Chromebook (.deb)

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: '¿Publicar también en GitHub Releases?'
        required: false
        type: boolean
        default: false
  push:
    tags:
      - 'v*'

jobs:
  build-chromebook:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Instalar Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Cache de dependencias de Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Instalar dependencias del sistema de Linux
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libudev-dev \
            build-essential \
            curl \
            pkg-config

      - name: Instalar dependencias de Node/pnpm
        run: |
          pnpm install

      - name: Descargar arduino-cli para Linux 64-bit
        run: |
          mkdir -p tools/Arduino
          curl -fsSL https://raw.githubusercontent.com/arduino/arduino-cli/master/install.sh | BINDIR="tools/Arduino" sh
          chmod +x tools/Arduino/arduino-cli

      - name: Compilar backend Node SEA para Linux
        run: |
          chmod +x scripts/build-backends-linux.sh
          ./scripts/build-backends-linux.sh

      - name: Compilar Frontend (Scratch GUI + SketchForge)
        run: |
          pnpm run build:app

      - name: Compilar paquete Tauri para Chromebook (.deb)
        run: |
          chmod +x src-tauri/linux/postinstall.sh
          pnpm exec tauri build --bundles deb

      - name: Subir artefacto .deb a GitHub Actions
        uses: actions/upload-artifact@v4
        with:
          name: stblock-chromebook-deb
          path: src-tauri/target/release/bundle/deb/*.deb
          if-no-files-found: error

      - name: Publicar en Release (si aplica)
        if: ${{ startsWith(github.ref, 'refs/tags/v') || github.event.inputs.publish_release == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME="${GITHUB_REF#refs/tags/}"
          if [ -z "$TAG_NAME" ] || [ "$TAG_NAME" = "refs/heads/main" ]; then
            TAG_NAME="v$(node -p "require('./package.json').version")"
          fi
          DEB_FILE=$(ls src-tauri/target/release/bundle/deb/*.deb | head -n 1)
          echo "Adjuntando $DEB_FILE a la release $TAG_NAME..."
          gh release upload "$TAG_NAME" "$DEB_FILE" --clobber || echo "No se pudo subir a la release automáticamente, el archivo está disponible en Artefactos."
